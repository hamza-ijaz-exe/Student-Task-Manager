<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <h1>Student Task Manager</h1>
    </header>
    <main class="container">
        <div class="panel">
            <form class="task-form" id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Task Title</label>
                    <input type="text" id="taskTitle" placeholder="Enter task title" required>
                </div>
                <div class="form-group">
                    <label for="taskDescription">Task Description</label>
                    <textarea id="taskDescription" rows="4" placeholder="Enter task description" required></textarea>
                </div>
                <button type="submit" class="add-btn">Add Task</button>
            </form>
        </div>

        <div class="toolbar">
            <input type="text" id="searchInput" class="search-input" placeholder="Search tasks...">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="pending">Pending</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </div>

        <p id="emptyState" class="empty-state" hidden>No tasks found. Add one above!</p>

        <div id="taskList" class="task-list"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
